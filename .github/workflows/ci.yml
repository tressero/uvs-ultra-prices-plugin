name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package extension
        run: npm run package

      - name: Read build label
        id: build
        run: echo "label=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.build.outputs.label }}
          path: dist-*.zip
          if-no-files-found: error

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run package

      - name: Read build label
        id: build
        run: echo "label=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Attach the versioned zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-*.zip
          generate_release_notes: true

      # Optional: publish to the Chrome Web Store on tag.
      # Needs repository secrets CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
      # CHROME_CLIENT_SECRET and CHROME_REFRESH_TOKEN.
      - name: Upload to the Chrome Web Store
        if: ${{ secrets.CHROME_EXTENSION_ID != '' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "dist-${{ steps.build.outputs.label }}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

      - name: Deploy the pricing worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          npx wrangler deploy --config worker/wrangler.jsonc
          node tools/prime-worker.mjs || true
